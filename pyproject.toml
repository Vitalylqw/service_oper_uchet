[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project]
name = "service-oper-uchet"
version = "0.1.0"
description = "Система учета операций для парсинга Excel и загрузки в MS SQL Server"
authors = [
    {name = "Developer", email = "developer@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",  # For EmailStr support
    "python-dotenv>=1.0.0",  # For loading env files in parser runtime
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "psycopg2-binary>=2.9.0",  # PostgreSQL sync driver
    "aiosqlite>=0.19.0",  # SQLite async driver for development
    "APScheduler>=3.10.0",  # For scheduling
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.2.0",  # For retry logic
    "xlcalculator>=0.5.0",  # For Excel formula evaluation
    "aiofiles>=23.0.0",  # For async file operations
    "aiohttp>=3.9.0",  # For HTTP client
    "psutil>=5.9.0",  # For system metrics monitoring
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.6.0",
    "types-requests>=2.31.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
]

[project.urls]
"Homepage" = "https://github.com/username/service-oper-uchet"
"Bug Reports" = "https://github.com/username/service-oper-uchet/issues"
"Source" = "https://github.com/username/service-oper-uchet"

# Ruff configuration
[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    "*.md",
    "*.txt", 
    "*.json",
    "*.yaml",
    "*.yml",
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*.md" = ["ALL"]
"*.txt" = ["ALL"] 
"*.json" = ["ALL"]
"scripts/*.py" = ["F401", "F841", "E402", "E722", "B007", "W293"]
"scripts/**/*.py" = ["F401", "F841", "E402", "E722", "B007", "W293"]
"tests/**/*.py" = ["F401", "F841", "B007", "E402"]
"test_db_simple.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["service_oper_uchet"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# MyPy configuration
[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "pyodbc.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = [
    "tests",
]
norecursedirs = ["outdated code", ".git", "venv", ".venv", "build", "dist"]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "integration_db: marks tests as database integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
] 
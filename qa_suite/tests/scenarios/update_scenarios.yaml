# UPDATE Test Scenarios
# Tests for modifying existing data

scenarios:
  # TEST_UPD_01: Change deal statuses
  - id: TEST_UPD_01
    name: "Изменение статусов сделки"
    description: "Изменяет is_shipped и is_paid для существующей сделки"
    category: UPDATE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: update_deal_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        field_name: "is_shipped"
        field_value: "да"
      - type: update_deal_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        field_name: "is_paid"
        field_value: "да"
    
    expected:
      changes:
        insertions: 0
        updates: 1
        deletions: 0
      sync_success: true

  # TEST_UPD_02: Change deal financial values
  - id: TEST_UPD_02
    name: "Изменение финансовых показателей сделки"
    description: "Изменяет total_revenue и total_margin"
    category: UPDATE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: update_deal_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        field_name: "total_revenue"
        field_value: 160000.00
      - type: update_deal_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        field_name: "total_margin"
        field_value: 35000.00
    
    expected:
      changes:
        insertions: 0
        updates: 1
        deletions: 0
      sync_success: true

  # TEST_UPD_03: Change position quantity and prices
  - id: TEST_UPD_03
    name: "Изменение данных позиции"
    description: "Изменяет quantity и purchase_price позиции"
    category: UPDATE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: update_position_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        position_number: 1
        field_name: "quantity"
        field_value: 25
      - type: update_position_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        position_number: 1
        field_name: "purchase_price"
        field_value: 110.00
    
    expected:
      changes:
        insertions: 0
        updates: 1  # Position updated
        deletions: 0
      sync_success: true

  # TEST_UPD_04: Change product name
  - id: TEST_UPD_04
    name: "Изменение названия товара"
    description: "Изменяет product_name позиции"
    category: UPDATE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: update_position_field
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        position_number: 1
        field_name: "product_name"
        field_value: "Нож строительный КВТ НСМ-02 78492"
    
    expected:
      changes:
        insertions: 1  # New item with new name
        updates: 0
        deletions: 1   # Old item deleted
      sync_success: true

  # TEST_UPD_05: Change supplier name
  - id: TEST_UPD_05
    name: "Изменение поставщика позиции"

# INSERT Test Scenarios
# Tests for adding new data to the system

scenarios:
  # TEST_INS_01: Add new sheet (new period)
  - id: TEST_INS_01
    name: "Добавление нового листа (нового периода)"
    description: "Добавляет новый лист 'Июнь 2025' с 2 сделками и 5 позициями"
    category: INSERT
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: add_sheet
        sheet_name: "Июнь 2025"
        deals:
          - client_name: "ООО НОВЫЙ КЛИЕНТ"
            invoice_info: "6001 от 01.06.2025"
            invoice_number: "6001"
            invoice_date: "01.06.2025"
            seller: "КРЕПЕЖ-ИНСТРУМЕНТ ООО"
            is_shipped: "нет"
            is_paid: "нет"
            total_revenue: 50000.00
            total_margin: 10000.00
            total_cost: 40000.00
            items:
              - product_name: "Дрель аккумуляторная"
                quantity: 5
                purchase_price: 3000.00
                sale_price: 4000.00
                revenue: 20000.00
                margin: 5000.00
                cost: 15000.00
                supplier_name: "ЭТМ"
                pickup_date: "01"
              - product_name: "Набор бит"
                quantity: 10
                purchase_price: 500.00
                sale_price: 800.00
                revenue: 8000.00
                margin: 3000.00
                cost: 5000.00
                supplier_name: "ЭТМ"
                pickup_date: "01"
          - client_name: "ООО ВТОРОЙ КЛИЕНТ"
            invoice_info: "6002 от 02.06.2025"
            invoice_number: "6002"
            invoice_date: "02.06.2025"
            seller: "КРЕПЕЖ-ИНСТРУМЕНТ ООО"
            is_shipped: "да"
            is_paid: "нет"
            total_revenue: 30000.00
            total_margin: 6000.00
            total_cost: 24000.00
            items:
              - product_name: "Перфоратор"
                quantity: 2
                purchase_price: 8000.00
                sale_price: 10000.00
                revenue: 20000.00
                margin: 4000.00
                cost: 16000.00
                supplier_name: "ИНСТРУМЕНТ-СЕРВИС"
                pickup_date: "02"
              - product_name: "Буры SDS+"
                quantity: 20
                purchase_price: 200.00
                sale_price: 300.00
                revenue: 6000.00
                margin: 2000.00
                cost: 4000.00
                supplier_name: "ИНСТРУМЕНТ-СЕРВИС"
                pickup_date: "02"
              - product_name: "Кейс для инструмента"
                quantity: 2
                purchase_price: 1000.00
                sale_price: 1500.00
                revenue: 3000.00
                margin: 1000.00
                cost: 2000.00
                supplier_name: "ИНСТРУМЕНТ-СЕРВИС"
                pickup_date: "02"
    
    expected:
      changes:
        insertions: 7  # 2 deals + 5 items
        updates: 0
        deletions: 0
      db_state:
        deals_count: "+2"
        positions_count: "+5"
        deals_in_period:
          "Июнь 2025": 2
      events:
        - type: DealCreated
          count: 2
        - type: DealItemAdded
          count: 5
      sync_success: true

  # TEST_INS_02: Add new deal to existing period
  - id: TEST_INS_02
    name: "Добавление новой сделки в существующий период"
    description: "Добавляет нового клиента с 3 позициями в лист 'Май 2025'"
    category: INSERT
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: add_deal
        sheet_name: "Май 2025"
        deals:
          - client_name: "ООО ДОПОЛНИТЕЛЬНЫЙ"
            invoice_info: "5950 от 25.05.2025"
            invoice_number: "5950"
            invoice_date: "25.05.2025"
            seller: "КРЕПЕЖ-ИНСТРУМЕНТ ООО"
            is_shipped: "нет"
            is_paid: "нет"
            total_revenue: 25000.00
            total_margin: 5000.00
            total_cost: 20000.00
            items:
              - product_name: "Болты М10"
                quantity: 100
                purchase_price: 50.00
                sale_price: 80.00
                revenue: 8000.00
                margin: 3000.00
                cost: 5000.00
                supplier_name: "МЕТИЗЫ"
                pickup_date: "25"
              - product_name: "Гайки М10"
                quantity: 100
                purchase_price: 30.00
                sale_price: 50.00
                revenue: 5000.00
                margin: 2000.00
                cost: 3000.00
                supplier_name: "МЕТИЗЫ"
                pickup_date: "25"
              - product_name: "Шайбы М10"
                quantity: 200
                purchase_price: 10.00
                sale_price: 20.00
                revenue: 4000.00
                margin: 2000.00
                cost: 2000.00
                supplier_name: "МЕТИЗЫ"
                pickup_date: "25"
    
    expected:
      changes:
        insertions: 4  # 1 deal + 3 items
        updates: 0
        deletions: 0
      db_state:
        deals_count: "+1"
        positions_count: "+3"
      events:
        - type: DealCreated
          count: 1
        - type: DealItemAdded
          count: 3
      sync_success: true

  # TEST_INS_03: Add new positions to existing deal
  - id: TEST_INS_03
    name: "Добавление новых позиций к существующей сделке"
    description: "Добавляет 2 новых товара к существующей сделке ЛЕНТЕХСТРОЙ"
    category: INSERT
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: add_position
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        items:
          - product_name: "Отвертка крестовая"
            quantity: 15
            purchase_price: 80.00
            sale_price: 120.00
            revenue: 1800.00
            margin: 600.00
            cost: 1200.00
            supplier_name: "ЭТМ"
            pickup_date: "18"
          - product_name: "Изолента ПВХ"
            quantity: 50
            purchase_price: 25.00
            sale_price: 40.00
            revenue: 2000.00
            margin: 750.00
            cost: 1250.00
            supplier_name: "ЭТМ"
            pickup_date: "18"
    
    expected:
      changes:
        insertions: 2  # 2 new items
        updates: 1     # Deal updated (items_count changed)
        deletions: 0
      db_state:
        positions_count: "+2"
      events:
        - type: DealItemAdded
          count: 2
      sync_success: true

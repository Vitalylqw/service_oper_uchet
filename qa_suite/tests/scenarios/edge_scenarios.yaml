            invoice_date: "30.05.2025"
            seller: "КРЕПЕЖ-ИНСТРУМЕНТ ООО"
            is_shipped: "нет"
            is_paid: "нет"
            total_revenue: 5000.00
            total_margin: 1000.00
            total_cost: 4000.00
            items:
              - product_name: "Товар #1 (специальный) @ 100%"
                quantity: 5
                purchase_price: 500.00
                sale_price: 700.00
                revenue: 3500.00
                margin: 1000.00
                cost: 2500.00
                supplier_name: "Поставщик <А>"
                pickup_date: "30"
    
    expected:
      changes:
        insertions: 2  # 1 deal + 1 item
        updates: 0
        deletions: 0
      sync_success: true


# EDGE Test Scenarios
# Edge cases and boundary conditions

scenarios:
  # TEST_EDGE_01: Idempotency (same file twice)
  - id: TEST_EDGE_01
    name: "Идемпотентность (повторная синхронизация)"
    description: "Загружает тот же файл дважды - второй раз должно быть 0 изменений"
    category: EDGE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions: []  # No actions - just sync the same file again
    
    expected:
      changes:
        insertions: 0
        updates: 0
        deletions: 0
      sync_success: true

  # TEST_EDGE_02: Empty Excel file (only headers)
  - id: TEST_EDGE_02
    name: "Пустой Excel файл"
    description: "Файл только с заголовками - все данные должны быть удалены"
    category: EDGE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      # Remove all deals to make empty file
      - type: remove_sheet
        sheet_name: "Май 2025"
      - type: remove_sheet
        sheet_name: "Апрель 2025"
    
    expected:
      changes:
        insertions: 0
        updates: 0
        deletions: 7  # All existing deals and items
      db_state:
        deals_count: "0"
        positions_count: "0"
      sync_success: true

  # TEST_EDGE_03: Large volume (many deals)
  - id: TEST_EDGE_03
    name: "Большой объем данных"
    description: "Тест производительности с большим количеством сделок"
    category: EDGE
    enabled: false  # Disabled by default - long running
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: add_sheet
        sheet_name: "Август 2025"
        deals:
          - client_name: "КЛИЕНТ 001"
            invoice_info: "8001 от 01.08.2025"
            invoice_number: "8001"
            invoice_date: "01.08.2025"
            seller: "КРЕПЕЖ-ИНСТРУМЕНТ ООО"
            is_shipped: "нет"
            is_paid: "нет"
            total_revenue: 10000.00
            total_margin: 2000.00
            total_cost: 8000.00
            items:
              - product_name: "Товар 1"
                quantity: 10
                purchase_price: 100.00
                sale_price: 150.00
                supplier_name: "Поставщик"
          - client_name: "КЛИЕНТ 002"
            invoice_info: "8002 от 02.08.2025"
            invoice_number: "8002"
            invoice_date: "02.08.2025"
            seller: "КРЕПЕЖ-ИНСТРУМЕНТ ООО"
            is_shipped: "нет"
            is_paid: "нет"
            total_revenue: 10000.00
            total_margin: 2000.00
            total_cost: 8000.00
            items:
              - product_name: "Товар 2"
                quantity: 10
                purchase_price: 100.00
                sale_price: 150.00
                supplier_name: "Поставщик"
    
    expected:
      changes:
        insertions: 4  # 2 deals + 2 items
        updates: 0
        deletions: 0
      sync_success: true


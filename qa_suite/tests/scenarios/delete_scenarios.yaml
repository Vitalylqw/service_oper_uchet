# DELETE Test Scenarios
# Tests for removing data from the system

scenarios:
  # TEST_DEL_01: Remove entire sheet (period)
  - id: TEST_DEL_01
    name: "Удаление листа (целого периода)"
    description: "Удаляет лист 'Апрель 2025' со всеми данными"
    category: DELETE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: remove_sheet
        sheet_name: "Апрель 2025"
    
    expected:
      changes:
        insertions: 0
        updates: 0
        deletions: 3  # 1 deal + 2 items from April
      db_state:
        deals_in_period:
          "Апрель 2025": 0
      events:
        - type: DealDeleted
          count: 1
      sync_success: true

  # TEST_DEL_02: Remove deal from period
  - id: TEST_DEL_02
    name: "Удаление сделки из периода"
    description: "Удаляет сделку ЛЕНТЕХСТРОЙ со всеми позициями"
    category: DELETE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: remove_deal
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
    
    expected:
      changes:
        insertions: 0
        updates: 0
        deletions: 3  # 1 deal + 2 items
      db_state:
        deals_count: "-1"
        positions_count: "-2"
        deal_not_exists:
          - "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
      events:
        - type: DealDeleted
          count: 1
      sync_success: true

  # TEST_DEL_03: Remove some positions from deal
  - id: TEST_DEL_03
    name: "Частичное удаление позиций"
    description: "Удаляет 1 из 2 позиций сделки"
    category: DELETE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: remove_position
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        position_number: 2
    
    expected:
      changes:
        insertions: 0
        updates: 1  # Deal items_count updated
        deletions: 1
      db_state:
        positions_count: "-1"
        deal_exists:
          - "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
      sync_success: true

  # TEST_DEL_04: Remove all positions from deal
  - id: TEST_DEL_04
    name: "Удаление всех позиций из сделки"
    description: "Удаляет все позиции, оставляя пустую сделку"
    category: DELETE
    enabled: true
    
    setup:
      base_state: "base_state.xlsx"
      clear_db_before: true
      sync_base_first: true
    
    actions:
      - type: remove_position
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        position_number: 1
      - type: remove_position
        sheet_name: "Май 2025"
        deal_key: "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
        position_number: 1  # After first delete, position 2 becomes 1
    
    expected:
      changes:
        insertions: 0
        updates: 1  # Deal items_count updated to 0
        deletions: 2
      db_state:
        positions_count: "-2"
        deal_exists:
          - "5938|16.05.2025|крепеж-инструмент ооо|май 2025"
      sync_success: true
